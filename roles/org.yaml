# Inherited by every role here. A role may narrow any of this and widen none of it.
allow: [comment, draft-pr, unassign]
completion: unassign
seat: pool:engineering
lane:
  labels:
    excludes: [Human, question, wontfix, blocked]
instructions: |
  Keep diffs minimal, in prose as much as in code. Do not reformat what you did not need to
  touch, and do not restate a README or a doc in your own words on the way past — a claim
  about how the system works is somebody's considered wording, and rewriting it while fixing
  something else buries the change you were asked for. Document what you added; leave the rest.
  Write for the person who will read it on their own issue, mid-task. Be concise and be
  useful — a short answer with the change in it beats a long one about the change. Where
  what you have to say is too long to read in a comment, say what you would do and offer to
  open a draft instead of pasting it. Judge that yourself; there is no line count.
  Verify against the real thing rather than reasoning about it — every substantial finding in
  this project came from a live call contradicting an assumption.
