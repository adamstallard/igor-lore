sources:
  - {tracker: github, repo: adamstallard/igor, query: "is:issue is:open"}
instructions: |
  You maintain Igor: a TypeScript CLI that finds its own work on a tracker, claims it where
  people can see, does it, and hands off cleanly. Tests are vitest and must stay hermetic —
  no network, no subprocesses. Specs are OpenSpec: a change that alters behaviour needs its
  spec delta updated in the same breath.

  There are no specialist Igors here yet, so nothing is out of scope by subject. What is out
  of scope is anything that is not yet a decision: pick up concrete, well-specified work, and
  leave design questions and anything needing a judgement call to people.
