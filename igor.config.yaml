# The destination for an Igor working on Igor itself: the lore, the role definitions, and the
# machine-written state branch. The repository worked is named per role, under `sources`.
destination: .
reviewers: [adamstallard]
experts: [adamstallard]
publicStore: true

# No `budget` block, deliberately, and not because budgeting does not matter here.
#
# A seat's remaining window is read with `claude -p /usage`, which answers a `setup-token`
# credential with a cost summary instead of window percentages. Measured: the same command on
# the same machine returns "Current session: 17% used" for an interactive login and
# "Total cost: $0.0000" for a seat token. So any seat declared the documented way reports
# unreadable, the pool reports no headroom, and nothing is ever claimed.
# adamstallard/igor#30.
#
# With no seats, budget is not enforced and the worker runs on CLAUDE_CODE_OAUTH_TOKEN from the
# environment. The cost is the reserve: nothing now stops an Igor spending the whole window, so
# work items one at a time with `igor run <role> --claim <id>` rather than leaving `serve`
# running. Restore the block, and `seat:` in roles/org.yaml, once #30 is resolved.
